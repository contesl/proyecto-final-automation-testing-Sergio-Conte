name: Automated Tests - UI & API

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar pruebas de API
        run: |
          python -m pytest tests/test_api_reqres.py -v \
            --html=reports/reporte_api.html \
            --self-contained-html

      - name: Ejecutar pruebas de UI
        run: |
          python -m pytest tests/test_ui_saucedemo.py -v \
            --html=reports/reporte_ui.html \
            --self-contained-html

      - name: Subir reportes y capturas como artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
          retention-days: 30
