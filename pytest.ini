; Configuración de Pytest. Se aplica automáticamente cada vez que se ejecuta
; "python -m pytest" desde la carpeta raíz del proyecto.

[pytest]
; Carpeta donde Pytest busca los tests
testpaths = tests

; Opciones que se agregan a cada ejecución:
;   -v                     muestra el nombre y el resultado de cada test
;   --html=...             genera el reporte HTML en reports/reporte.html
;   --self-contained-html  guarda todo (estilos y capturas) dentro de un único archivo HTML
addopts = -v --html=reports/reporte.html --self-contained-html

; Muestra en la terminal, en tiempo real, los pasos que se registran en el log
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s - [%(levelname)s] - %(message)s
log_cli_date_format = %H:%M:%S
